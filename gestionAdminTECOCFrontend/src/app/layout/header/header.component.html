<header class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-6">
  <div class="text-sm text-slate-500">Bienvenido de nuevo</div>

  <div class="flex items-center gap-4">
    @if (currentUser()) {
      <div class="text-right">
        <p class="text-sm font-medium text-slate-800">{{ currentUser()!.name }}</p>
        <p class="text-xs text-slate-500">{{ currentUser()!.role }}</p>
      </div>
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-100 text-sm font-semibold text-emerald-700">
        {{ currentUser()!.name.charAt(0) }}
      </div>
      <button
        type="button"
        class="rounded-md border border-slate-200 px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-100"
        (click)="logout()"
      >
        Salir
      </button>
    }
  </div>
</header>
